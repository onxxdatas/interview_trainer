services:
  - type: worker
    name: interview-trainer-bot
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -e .
    startCommand: python -m app.main
    autoDeploy: true
    disk:
      name: interview-trainer-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./data/interview_trainer.db
      - key: DEFAULT_INTERVAL_MINUTES
        value: "15"
      - key: LOG_LEVEL
        value: INFO
